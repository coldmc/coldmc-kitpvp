  Summoner:
    Name: '&fGolem'
    Description: ['&7An iron golem fights for you for 20 seconds.']
    Trigger: right_click
    Item: IRON_BLOCK
    Cooldown: 70
    Cancel: true
    Golem-Lasts-For: 20
  Souper:
    Name: '&6Refill'
    Description: ['&7Moves soup from your backpack into your hotbar.']
    Trigger: right_click
    Item: CHEST
    Cooldown: 15
    Cancel: true
  Bane:
    Name: '&5Bane'
    Description: ['&7Blinds, slows and weakens who you look at for 8 seconds.', '&7You hit weakly yourself meanwhile.']
    Trigger: right_click
    Item: GOLDEN_HOE
    Cooldown: 45
    Cancel: true
    Duration: 8
    Range: 12
  Sunder:
    Name: '&dSunder'
    Description: ['&7Swaps your health with who you look at.']
    Trigger: right_click
    Item: BEACON
    Cooldown: 30
    Cancel: true
    Range: 12
  Centaur:
    Name: '&6War stomp'
    Description: ['&7Massive damage to everyone within 4 blocks - you too.', '&7Whoever survives regenerates.']
    Trigger: right_click
    Item: GUNPOWDER
    Cooldown: 30
    Cancel: true
    Damage-Radius: 4
    Damage: 18
    Self-Damage: 9
    Regen-Level: 2
    Regen-Duration: 5
  Blinker:
    Name: '&dBlink'
    Description: ['&7Your arrow takes you to who it hits, and leaves them a TNT.']
    Trigger: projectile_hit
    Projectile: ARROW
    Cooldown: 25
    Fuse: 1.5
  Switcher:
    Name: '&fSwitch'
    Description: ['&7Your snowball swaps places with who it hits.']
    Trigger: projectile_hit
    Projectile: SNOWBALL
    Silent: true
  LaPeace:
    Name: '&dLa Peace'
    Description: ['&7Your snowball swaps places with who it hits,', '&7and for 3 seconds neither of you can hit or be hit.']
    Trigger: projectile_hit
    Projectile: SNOWBALL
